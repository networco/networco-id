apiVersion: apps/v1
kind: Deployment
metadata:
  name: networcoid-worker
  namespace: networco-id
spec:
  replicas: 1
  selector:
    matchLabels:
      app: networcoid-worker
  template:
    metadata:
      labels:
        app: networcoid-worker
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: worker
        image: ghcr.io/networco/networco-id-worker:latest
        env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-host
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-password
        - name: NATS_URL
          # HA NATS: shared 3-node cluster in networco-nats (cut over 2026-06-06).
          value: "nats://nats.networco-nats.svc.cluster.local:4222"
        - name: NATS_STREAM_REPLICAS
          # Absent on prod → code defaults to 3. Single-node test sets it to 1.
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: nats-stream-replicas
              optional: true
        - name: SMTP_HOST
          value: "smtp-relay.brevo.com"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          value: "noreply@networco.no"
        - name: BREVO_API_KEY
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: brevo-api-key
        - name: EMAIL_SENDER_NAME
          value: "NETWORCO"
        - name: EMAIL_SENDER_EMAIL
          value: "noreply@networco.no"
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: resend-api-key
              optional: true
        # postbud, the platform's own mail service. Optional: without the
        # key the provider is skipped and the chain is exactly as before.
        # URL and sender come from the per-environment env file (kubectl
        # set env), because the sender differs between test and prod and
        # must lie inside the domains postbud's tenant is registered for.
        - name: POSTBUD_APIKEY
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: postbud-api-key
              optional: true
        - name: EMAIL_PROVIDERS
          value: "brevo,resend"
        - name: WORKER_LIVENESS_FILE
          value: /tmp/networcoid-worker-alive
        # The worker serves no HTTP, so liveness stats a file the consume loop refreshes
        # once a minute while a consumer is established. It is NOT a throughput check —
        # a worker with no mail to deliver is healthy, so "nothing processed lately" must
        # never restart anything. It catches the case that actually bit us: the consume
        # loop crashing and retrying every 5s for an hour while the pod sat Ready and
        # delivered nothing, because the outer loop swallows the failure by design.
        #
        # 180s of staleness = three missed heartbeats, then 3 x 30s of probe failures, so
        # a genuinely stuck worker restarts in about 4 minutes. Restarting does not repair
        # a drifted stream or a NATS outage — it converts a silent pod into a visibly
        # restarting one, which is the point.
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - '[ -f "$WORKER_LIVENESS_FILE" ] && [ $(( $(date +%s) - $(stat -c %Y "$WORKER_LIVENESS_FILE") )) -lt 180 ]'
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
