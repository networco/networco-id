apiVersion: apps/v1
kind: Deployment
metadata:
  name: networcoid-worker
  namespace: networco-id
spec:
  replicas: 1
  selector:
    matchLabels:
      app: networcoid-worker
  template:
    metadata:
      labels:
        app: networcoid-worker
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: worker
        image: ghcr.io/networco/networco-id-worker:latest
        env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-host
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-password
        - name: NATS_URL
          # HA NATS: shared 3-node cluster in networco-nats (cut over 2026-06-06).
          value: "nats://nats.networco-nats.svc.cluster.local:4222"
        - name: NATS_STREAM_REPLICAS
          # Absent on prod → code defaults to 3. Single-node test sets it to 1.
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: nats-stream-replicas
              optional: true
        - name: SMTP_HOST
          value: "smtp-relay.brevo.com"
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          value: "noreply@networco.no"
        - name: BREVO_API_KEY
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: brevo-api-key
        - name: EMAIL_SENDER_NAME
          value: "NETWORCO"
        - name: EMAIL_SENDER_EMAIL
          value: "noreply@networco.no"
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: resend-api-key
              optional: true
        # postbud, the platform's own mail service. Optional: without the
        # key the provider is skipped and the chain is exactly as before.
        # URL and sender come from the per-environment env file (kubectl
        # set env), because the sender differs between test and prod and
        # must lie inside the domains postbud's tenant is registered for.
        - name: POSTBUD_APIKEY
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: postbud-api-key
              optional: true
        - name: EMAIL_PROVIDERS
          value: "brevo,resend"
