apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: networcoid-ingress
  namespace: networcoid
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - id.networco.no # Replace with your domain
    secretName: networcoid-tls
  rules:
  - host: id.networco.no # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: networcoid-api
            port:
              number: 80
