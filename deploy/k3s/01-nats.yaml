---
# NATS JetStream for the NetworcoID cluster.
#
# IMPORTANT: this used to be a `Deployment` with no PersistentVolume — when
# someone later layered a StatefulSet on top to fix the data-loss issue, the
# old Deployment was never removed. Both pods coexisted for ~94 days with the
# same `app: nats` label, so the Service round-robined between them and
# half of the published JetStream messages went to an ephemeral pod with an
# empty stream. See the StatefulSet definition below — that's the canonical
# NATS instance and the manifest to keep aligned.
#
# Single replica is fine for current traffic. To scale out: bump `replicas`
# AND add a `cluster {}` block to `nats.conf` so the pods form a JetStream
# cluster instead of running as independent islands.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: networco-id
  labels:
    app: nats
    component: messaging
data:
  nats.conf: |
    # NATS Server configuration
    port: 4222
    http_port: 8222

    # JetStream — persistent message store backed by the StatefulSet PVC.
    # store_dir is `/data` to match the previous pod's `-sd /data` arg, so
    # the existing on-disk JetStream layout (`/data/jetstream/$G/streams/…`)
    # is preserved through this rollout. Don't change this without a planned
    # data migration.
    jetstream {
      store_dir: /data
      max_file_store: 2GB
      max_memory_store: 256MB
    }

    logtime: true
    debug: false
    trace: false
---
# Client + governing service for the StatefulSet. Single regular ClusterIP
# Service (rather than the more-conventional headless + client split) — this
# matches the running cluster's `serviceName: nats` on the StatefulSet, which
# is immutable. With one replica this is fine; if we ever scale to a NATS
# cluster, switch to a headless service + cluster {} block in nats.conf and
# do it via a fresh StatefulSet name (since `serviceName` can't be edited).
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: networco-id
  labels:
    app: nats
    component: messaging
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8222"
spec:
  type: ClusterIP
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: networco-id
  labels:
    app: nats
    component: messaging
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
        component: messaging
    spec:
      containers:
        - name: nats
          image: nats:2.12.7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - nats-server
            - --config
            - /etc/nats/nats.conf
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: nats-config
  # Volume claim template name MUST stay `data` so the existing PVC
  # `data-nats-0` (networco-standard, 1Gi) is reused on apply. Renaming this
  # would orphan the existing volume and provision a fresh empty one.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: networco-standard
        resources:
          requests:
            storage: 1Gi
