apiVersion: apps/v1
kind: Deployment
metadata:
  name: networcoid
  namespace: networco-id
spec:
  replicas: 1
  selector:
    matchLabels:
      app: networcoid
  template:
    metadata:
      labels:
        app: networcoid
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: api
        image: ghcr.io/networco/networco-id:latest
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: database-url
        - name: NetworcoId__Secret
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: jwt-secret
        - name: NetworcoId__Issuer
          value: "https://id.networco.countdown.no"
        - name: NetworcoId__BaseUrl
          value: "https://id.networco.countdown.no"
        - name: NATS_URL
          value: "nats://nats.networco-id.svc.cluster.local:4222"
        - name: NETWORCO_EXTRA_ADMINS
          value: "andre@biseth.net"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: networcoid
  namespace: networco-id
spec:
  selector:
    app: networcoid
  ports:
  - port: 80
    targetPort: 8080
