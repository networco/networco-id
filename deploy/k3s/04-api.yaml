apiVersion: apps/v1
kind: Deployment
metadata:
  name: networcoid
  namespace: networco-id
spec:
  replicas: 1
  selector:
    matchLabels:
      app: networcoid
  template:
    metadata:
      labels:
        app: networcoid
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: api
        image: ghcr.io/networco/networco-id:latest
        env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-host
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-password
        - name: NetworcoId__Secret
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: jwt-secret
        - name: NetworcoId__Issuer
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: issuer
        - name: NetworcoId__BaseUrl
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: base-url
        # Public app origin (where post-link / post-verify redirects go). Without it
        # FrontendUrl falls back to http://localhost:3000, breaking those redirects.
        - name: NetworcoId__FrontendUrl
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: frontend-url
              optional: true
        - name: NATS_URL
          # HA NATS: shared 3-node cluster in networco-nats (cut over 2026-06-06).
          value: "nats://nats.networco-nats.svc.cluster.local:4222"
        - name: NATS_STREAM_REPLICAS
          # Absent on prod → code defaults to 3 (HA cluster). Single-node test
          # sets this to 1 via the secret (a lone NATS server can't host R=3).
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: nats-stream-replicas
              optional: true
        - name: NETWORCO_EXTRA_ADMINS
          value: "andre@biseth.net"
        - name: Admin__AccessKey
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: admin-access-key
              optional: true
        - name: Admin__Password
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: admin-password
              optional: true
        - name: INITIAL_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: admin-email
              optional: true
        - name: INITIAL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: client-id
              optional: true
        - name: INITIAL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: client-secret
              optional: true
        # External login via IDura (BankID). All optional — absent on envs that
        # don't enable it (the code keeps the scheme/button off unless ENABLED
        # plus domain/client are all present).
        - name: IDURA_ENABLED
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: idura-enabled
              optional: true
        - name: IDURA_DOMAIN
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: idura-domain
              optional: true
        - name: IDURA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: idura-client-id
              optional: true
        - name: IDURA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: idura-client-secret
              optional: true
        - name: IDURA_ACR_VALUES
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: idura-acr-values
              optional: true
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: networcoid
  namespace: networco-id
spec:
  selector:
    app: networcoid
  ports:
  - port: 80
    targetPort: 8080
