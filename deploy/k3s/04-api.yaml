apiVersion: apps/v1
kind: Deployment
metadata:
  name: networcoid-api
  namespace: networcoid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: networcoid-api
  template:
    metadata:
      labels:
        app: networcoid-api
    spec:
      containers:
      - name: api
        image: networco/networco-id-api:latest # Replace with your registry
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: database-url
        - name: NetworcoId__Secret
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: jwt-secret
        - name: NATS_URL
          value: "nats://nats.networcoid.svc.cluster.local:4222"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: networcoid-api
  namespace: networcoid
spec:
  selector:
    app: networcoid-api
  ports:
  - port: 80
    targetPort: 8080
