apiVersion: apps/v1
kind: Deployment
metadata:
  name: networcoid
  namespace: networco-id
spec:
  replicas: 1
  selector:
    matchLabels:
      app: networcoid
  template:
    metadata:
      labels:
        app: networcoid
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: api
        image: ghcr.io/networco/networco-id:latest
        env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-host
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-name
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: db-password
        - name: NetworcoId__Secret
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: jwt-secret
        - name: NetworcoId__Issuer
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: issuer
        - name: NetworcoId__BaseUrl
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: base-url
        - name: NATS_URL
          value: "nats://nats.networco-id.svc.cluster.local:4222"
        - name: NETWORCO_EXTRA_ADMINS
          value: "andre@biseth.net"
        - name: Admin__AccessKey
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: admin-access-key
              optional: true
        - name: Admin__Password
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: admin-password
              optional: true
        - name: INITIAL_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: admin-email
              optional: true
        - name: INITIAL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: client-id
              optional: true
        - name: INITIAL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: networcoid-secrets
              key: client-secret
              optional: true
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: networcoid
  namespace: networco-id
spec:
  selector:
    app: networcoid
  ports:
  - port: 80
    targetPort: 8080
