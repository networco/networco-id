# Traefik configuration for the PROD (srv01/02/03) cluster — IDENTICAL for test and prod
# since the cert-manager migration (2026-08-19). Applied BY HAND (see README);
# networco-app carries the same values in
# infrastructure/k3s/manifests/00-traefik-config.yaml, applied by its deploy.sh —
# keep the two in sync, they manage the SAME cluster object.
#
# Traefik holds NO certificate state. TLS comes from cert-manager-issued
# Secrets referenced by each Ingress/IngressRoute. That is what allows:
#   - DaemonSet: one Traefik pod per node (no RWO ACME volume pinning it to one)
#   - externalTrafficPolicy: Local — kube-proxy stops SNAT-ing, so Traefik sees
#     the REAL client IP instead of the CNI gateway 10.42.0.1
#
# Do NOT re-add certificatesresolvers here. Besides re-creating the state
# problem, the resolver intercepts every /.well-known/acme-challenge/ request
# on port 80, which 404s cert-manager's HTTP-01 challenges — the two cannot
# coexist.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # One pod per node: every node DNS points at has a local Traefik, which
    # externalTrafficPolicy: Local requires (it never crosses nodes).
    deployment:
      kind: DaemonSet

    additionalArguments:
      # Redirect plain HTTP -> HTTPS so the bare domain works in a browser.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--log.level=INFO"

    ports:
      web:
        port: 80
        exposedPort: 80
      websecure:
        port: 443
        exposedPort: 443
        tls:
          enabled: true

    # Deliver to the node-local pod without SNAT: preserves the client IP and
    # is safe now that the DaemonSet guarantees a pod on every node.
    service:
      spec:
        externalTrafficPolicy: Local
