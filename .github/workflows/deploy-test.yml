# =============================================================================
# NetworcoID Test — Continuous Deploy to id.test.networco.no on every merge to main
# =============================================================================
#
# Mirrors the main app's deploy-test workflow. Builds the IdP api + worker images
# (test version) and deploys to the single-node test cluster (tst01) over the
# tailnet as an ephemeral tag:ci node, then runs the IdP rollout.
#
# Secrets in the (ungated) `test` GitHub environment of this repo:
#   ENV_ID_TEST       — env file for the IdP test secrets (see keys below)
#   KUBECONFIG_TEST   — kubeconfig targeting tst01's tailnet IP (https://100.118.34.4:6443)
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET — Tailscale OAuth client (tag:ci)
# Repo-level (optional): DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (authenticated
#   buildkit base pulls — omit to pull anonymously).
#
# ENV_ID_TEST keys: POSTGRES_HOST POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD
#   JWT_SECRET ISSUER BASE_URL INITIAL_ADMIN_EMAIL INITIAL_ADMIN_PASSWORD
#   ADMIN_ACCESS_KEY INITIAL_CLIENT_ID INITIAL_CLIENT_SECRET BREVO_API_KEY
#   POSTBUD_URL POSTBUD_APIKEY POSTBUD_SENDER_EMAIL POSTBUD_SENDER_NAME
#   EMAIL_PROVIDERS (ordered, e.g. "postbud" or "postbud,brevo")
#   NATS_URL NATS_STREAM_REPLICAS GHCR_USERNAME GHCR_TOKEN
#   APP_CALLBACK (e.g. https://test.networco.no/auth/callback)
#   CLIENT_AUDIENCE (e.g. https://api.test.networco.no)
# =============================================================================

name: Deploy Test

on:
  # Test deploys are gated to rc pre-releases ONLY (no longer on every push to main).
  # Merging used to ALSO deploy here, so every change ran two test deploys (push + rc)
  # that doubled Actions usage. An rc pre-release (v1.2.3-rc.N) deploys that exact
  # version to test, so the number can later be promoted unchanged to prod. Full
  # releases never reach here — release.yml owns prod via the `released` event.
  # (prod versioning uses the release tag, not the VERSION file, so dropping the
  # push-time VERSION bump is safe.)
  release:
    types: [prereleased]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/networco

jobs:
  version:
    name: Compute test version from VERSION file
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        name: Compute test version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # rc pre-release tag, e.g. v0.11.0-rc.1 → 0.11.0-rc.1 (do NOT touch VERSION)
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            # VERSION is the source of truth (major.minor.patch.build). Keep
            # major.minor.patch and set the build segment to this run number.
            BASE=$(cut -d. -f1-3 VERSION)
            VERSION="${BASE}.${{ github.run_number }}"
            echo "$VERSION" > VERSION
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed test version: $VERSION"
      - name: Commit bumped VERSION back to main
        if: github.event_name != 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --cached --quiet && { echo "VERSION unchanged"; exit 0; }
          git commit -m "chore(ci): bump VERSION build to ${{ steps.ver.outputs.version }} [skip ci]"
          git pull --rebase origin main || true
          git push origin main

  build:
    name: Build ${{ matrix.svc }} image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { svc: networco-id,        dockerfile: src/NetworcoId/Dockerfile }
          - { svc: networco-id-worker, dockerfile: src/NetworcoId.Worker/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - name: Generate a throwaway data-protection cert
        # The Dockerfile COPYs src/NetworcoId/dataprotection.pfx, which is
        # gitignored (a secret) so it's absent in CI. At runtime the IdP only
        # uses it when DATA_PROTECTION_CERT_PATH is set (the test deploy doesn't —
        # keys persist to the DB), so a fresh self-signed pfx just satisfies the
        # build COPY. No real secret enters the repo or image.
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -subj "/CN=networco-id-test" -keyout /tmp/dp.key -out /tmp/dp.crt
          openssl pkcs12 -export -out src/NetworcoId/dataprotection.pfx \
            -inkey /tmp/dp.key -in /tmp/dp.crt -passout pass:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        # Use the GHCR PAT (write:packages) rather than GITHUB_TOKEN: the
        # networco-id / networco-id-worker packages were first created out-of-band
        # and aren't linked to this repo, so GITHUB_TOKEN gets 403 on push.
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push ${{ matrix.svc }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.svc }}:${{ needs.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=idtest-${{ matrix.svc }}
          cache-to: type=gha,mode=max,scope=idtest-${{ matrix.svc }}
          platforms: linux/amd64

  deploy:
    name: Deploy to Test
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: test
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NS: networco-id
    steps:
      - uses: actions/checkout@v5
      - name: Restore test secret files
        # Secrets arrive as ENV VARS, never interpolated into the script
        # text. A secret containing a double quote used to close the
        # shell string early -- POSTBUD_SENDER_EMAIL="Networco <addr>"
        # turned <addr> into a redirect and failed the deploy with
        # "No such file or directory". Anything the value contains is
        # now data, not syntax.
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_ID_TEST }}
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_TEST }}
        run: |
          mkdir -p _ci
          printf '%s' "$ENV_FILE_CONTENT" > _ci/.env.test
          printf '%s' "$KUBECONFIG_CONTENT" > _ci/kubeconfig
          chmod 600 _ci/kubeconfig
      - name: Connect to the tailnet (ephemeral tag:ci node)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Wait for the test k3s API over the tailnet
        run: |
          for i in $(seq 1 30); do
            if curl -sk --max-time 5 https://100.118.34.4:6443/healthz -o /dev/null; then
              echo "✓ k3s API reachable"; exit 0
            fi
            echo "waiting for tailnet path ($i/30)…"
            tailscale ping --c 1 --until-direct=false 100.118.34.4 || true
            sleep 5
          done
          echo "::error::test k3s API never became reachable"; exit 1
      - name: Deploy id-test
        env:
          KUBECONFIG: ${{ github.workspace }}/_ci/kubeconfig
        run: |
          # Robust env load: tolerates spaces and quotes in values (a bare space
          # in a value once failed the deploy via `source`). Skips comments/blanks.
          while IFS= read -r _l || [ -n "$_l" ]; do
            case "$_l" in ''|\#*) continue;; esac
            _k=${_l%%=*}; _v=${_l#*=}
            case "$_k" in *[!A-Za-z0-9_]*|'') continue;; esac
            _v=${_v#\"}; _v=${_v%\"}; _v=${_v#\'}; _v=${_v%\'}
            export "$_k=$_v"
          done < _ci/.env.test
          # FrontendUrl = the public app origin (post-link / post-verify redirect target).
          # Prefer an explicit FRONTEND_URL from the env file; otherwise derive it from
          # BASE_URL by dropping the `id.` IdP subdomain (id.test.networco.no → test.networco.no).
          FRONTEND_URL="${FRONTEND_URL:-$(printf '%s' "$BASE_URL" | sed 's#//id\.#//#')}"
          export FRONTEND_URL
          echo "Using FRONTEND_URL=$FRONTEND_URL"
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          # Registry pull secret
          kubectl create secret docker-registry ghcr-secret -n "$NS" \
            --docker-server=ghcr.io --docker-username="$GHCR_USERNAME" --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          # IdP secrets
          kubectl create secret generic networcoid-secrets -n "$NS" \
            --from-literal=db-host="$POSTGRES_HOST" \
            --from-literal=db-name="$POSTGRES_DB" \
            --from-literal=db-user="$POSTGRES_USER" \
            --from-literal=db-password="$POSTGRES_PASSWORD" \
            --from-literal=jwt-secret="$JWT_SECRET" \
            --from-literal=admin-access-key="$ADMIN_ACCESS_KEY" \
            --from-literal=admin-password="$INITIAL_ADMIN_PASSWORD" \
            --from-literal=admin-email="$INITIAL_ADMIN_EMAIL" \
            --from-literal=client-id="$INITIAL_CLIENT_ID" \
            --from-literal=client-secret="$INITIAL_CLIENT_SECRET" \
            --from-literal=brevo-api-key="$BREVO_API_KEY" \
            --from-literal=resend-api-key="$RESEND_API_KEY" \
            --from-literal=postbud-api-key="$POSTBUD_APIKEY" \
            --from-literal=issuer="$ISSUER" \
            --from-literal=base-url="$BASE_URL" \
            --from-literal=frontend-url="$FRONTEND_URL" \
            --from-literal=NATS_URL="$NATS_URL" \
            --from-literal=nats-stream-replicas="$NATS_STREAM_REPLICAS" \
            --from-literal=idura-enabled="$IDURA_ENABLED" \
            --from-literal=idura-domain="$IDURA_DOMAIN" \
            --from-literal=idura-client-id="$IDURA_CLIENT_ID" \
            --from-literal=idura-client-secret="$IDURA_CLIENT_SECRET" \
            --from-literal=idura-acr-values="$IDURA_ACR_VALUES" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Hydrate manifests: id.test host + test image tags
          tmp=$(mktemp -d); cp deploy/k3s/0*.yaml "$tmp/"
          sed -i "s|id\\.networco\\.no|$(echo "$BASE_URL" | sed 's|https://||')|g" "$tmp"/06-ingress.yaml
          sed -i "s|ghcr.io/networco/networco-id:latest|$IMAGE_PREFIX/networco-id:$VERSION|g" "$tmp"/04-api.yaml
          sed -i "s|ghcr.io/networco/networco-id-worker:latest|$IMAGE_PREFIX/networco-id-worker:$VERSION|g" "$tmp"/05-worker.yaml
          kubectl apply -f "$tmp"/00-namespace.yaml -f "$tmp"/04-api.yaml -f "$tmp"/05-worker.yaml -f "$tmp"/06-ingress.yaml
          # Env-aware sender from the env file (test → "NETWORCO TEST") instead of
          # the prod literal in the manifest. Use `set env` not sed: an embedded
          # space inside a YAML-run sed silently dropped it. Only overrides when set.
          [ -n "$EMAIL_SENDER_NAME" ]  && kubectl set env deployment/networcoid-worker -n "$NS" "EMAIL_SENDER_NAME=$EMAIL_SENDER_NAME"
          [ -n "$EMAIL_SENDER_EMAIL" ] && kubectl set env deployment/networcoid-worker -n "$NS" "EMAIL_SENDER_EMAIL=$EMAIL_SENDER_EMAIL"
          # postbud: its sender address is separate from the Brevo one because
          # postbud only accepts a From inside its tenant's registered domains.
          # EMAIL_PROVIDERS decides which rail actually carries the mail.
          [ -n "$POSTBUD_URL" ]          && kubectl set env deployment/networcoid-worker -n "$NS" "POSTBUD_URL=$POSTBUD_URL"
          [ -n "$POSTBUD_SENDER_EMAIL" ] && kubectl set env deployment/networcoid-worker -n "$NS" "POSTBUD_SENDER_EMAIL=$POSTBUD_SENDER_EMAIL"
          [ -n "$POSTBUD_SENDER_NAME" ]  && kubectl set env deployment/networcoid-worker -n "$NS" "POSTBUD_SENDER_NAME=$POSTBUD_SENDER_NAME"
          [ -n "$EMAIL_PROVIDERS" ]      && kubectl set env deployment/networcoid-worker -n "$NS" "EMAIL_PROVIDERS=$EMAIL_PROVIDERS"
          kubectl rollout restart deployment/networcoid deployment/networcoid-worker -n "$NS"
          kubectl rollout status deployment/networcoid -n "$NS" --timeout=180s
          kubectl rollout status deployment/networcoid-worker -n "$NS" --timeout=180s
      - name: Register app redirect URI + audience on the OAuth client
        env:
          KUBECONFIG: ${{ github.workspace }}/_ci/kubeconfig
        run: |
          # Robust env load: tolerates spaces and quotes in values (a bare space
          # in a value once failed the deploy via `source`). Skips comments/blanks.
          while IFS= read -r _l || [ -n "$_l" ]; do
            case "$_l" in ''|\#*) continue;; esac
            _k=${_l%%=*}; _v=${_l#*=}
            case "$_k" in *[!A-Za-z0-9_]*|'') continue;; esac
            _v=${_v#\"}; _v=${_v%\"}; _v=${_v#\'}; _v=${_v%\'}
            export "$_k=$_v"
          done < _ci/.env.test
          # The IdP bootstraps the client with only its own /admin/callback and a
          # default scope set. Add the app callback, the audience the API
          # validates, and the scopes the app requests (incl. offline_access).
          kubectl exec -n networco-db pg-1 -c postgres -- psql -d networco_id -v ON_ERROR_STOP=1 -c \
            "UPDATE o_auth_clients SET \
               redirect_uris  = (SELECT array_agg(DISTINCT u) FROM unnest(redirect_uris  || ARRAY['${APP_CALLBACK}']) u), \
               allowed_scopes = (SELECT array_agg(DISTINCT u) FROM unnest(allowed_scopes || ARRAY['openid','profile','email','offline_access']) u), \
               audience = '${CLIENT_AUDIENCE}' \
             WHERE client_id = '${INITIAL_CLIENT_ID}';"
